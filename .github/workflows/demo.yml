# Publish the demo page to GitHub Pages. Started by hand (Actions tab, or
# `gh workflow run demo.yml --ref <branch>`).
#
# The demo clips are not in git. They are one file, demo-clips.tar.gz
# (holding TeslaCam/{SavedClips,SentryClips}/...), on the release tagged
# "demo-clips". Make them with scripts/make-demo-clips.py; replace that file
# to change the clips.
name: Demo site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      # Server and page libraries only; skip Electron's download.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Get demo clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p demo-clips
          gh release download demo-clips -p demo-clips.tar.gz -O - \
            | tar -xz -C demo-clips
      # The server reads folder names as local time; use the zone the
      # clips were recorded in, or the list times shift.
      - run: scripts/build-demo-site.sh demo-clips/TeslaCam site
        env:
          TZ: America/Los_Angeles
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
